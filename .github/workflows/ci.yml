# Build, unit tests, and a check that every API path the CLI calls is still in
# the public v2 spec. Weekly too, so a spec change that breaks the CLI is caught
# without a CLI commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run check-spec
